name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          YARN_VERSION: "1.22"

      - name: Run unit tests
        run: yarn test:unit --passWithNoTests

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish --access public